{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - SmartHire</title>
  <link rel="stylesheet" href="{% static 'css/candidate/candidate_settings.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

  <!-- Navbar -->
  <header class="dashboard-header">
    <div class="logo">SmartHire</div>
    <nav>
      <a href="{% url 'candidate' %}">Home</a>
      <a href="{% url 'candidate_profile' %}">Profile</a>
      <a href="{% url 'candidate_joblist' %}">Jobs</a>
      <a href="{% url 'candidate_applications' %}">Applications</a>
      <a href="{% url 'candidate_shortlist' %}">Shortlisted</a>
      <a href="{% url 'candidate_notification' %}">Notifications</a>
      <a href="{% url 'candidate_settings' %}">Settings</a>
      <a href="{% url 'home' %}" class="btn-logout">Logout</a>
    </nav>
  </header>

  <!-- Settings Content -->
  <main class="dashboard-content">
    <div class="settings-container">
      <h2>Settings</h2>

      <!-- Change Password -->
      <div class="settings-card">
        <h3>Change Password</h3>
        <form action="/change_password" method="POST">
          <label>Current Password</label>
          <input type="password" name="current_password" required>
          
          <label>New Password</label>
          <input type="password" name="new_password" required>
          
          <label>Confirm New Password</label>
          <input type="password" name="confirm_password" required>
          
          <button type="submit" class="btn btn-primary">Update Password</button>
        </form>
      </div>

      <!-- Notification Preferences -->
      <div class="settings-card">
        <h3>Notification Preferences</h3>
        <form action="/update_notifications" method="POST">
          <label><input type="checkbox" name="job_alerts" checked> Job Alerts</label><br>
          <label><input type="checkbox" name="application_updates" checked> Application Updates</label><br>
          <label><input type="checkbox" name="newsletter"> Newsletter</label><br>
          <button type="submit" class="btn btn-primary">Save Preferences</button>
        </form>
      </div>

      <!-- Privacy Settings -->
      <div class="settings-card">
        <h3>Privacy Settings</h3>
        <form action="/update_privacy" method="POST">
          <label><input type="checkbox" name="profile_visibility" checked> Make my profile visible to recruiters</label><br>
          <label><input type="checkbox" name="email_visibility"> Allow email visibility</label><br>
          <button type="submit" class="btn btn-primary">Update Privacy</button>
        </form>
      </div>

    </div>
  </main>

</body>
</html>
