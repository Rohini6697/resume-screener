{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details Form</title>
    <link rel="stylesheet" href="{% static 'css/candidate/candidate_details.css' %}">
</head>
<body>
    <div class="container">
        <h2>Job Details Form</h2>

        <form id="jobForm">
            {% csrf_token %}
            <label>Full Name</label>
            <input type="text" id="fullname" required>

            <label>Email</label>
            <input type="email" id="email" required>

            <label>Phone</label>
            <input type="text" id="phone">

            <!-- <label>Preferred Job Role</label>
            <input type="text" id="preferredJob" placeholder="e.g. Frontend Developer" required> -->

            <label>Preferred Location</label>
            <input type="text" id="preferredLocation" placeholder="e.g. Bangalore" required>

            <label>Skills</label>
            <textarea id="skills" placeholder="Enter your skills..."></textarea>

            <label>Experience (in years)</label>
            <input type="number" id="experience" min="0">

            <label>Upload Resume</label>
            <input type="file" id="resume">

            <button type="submit" class="btn">Submit</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
