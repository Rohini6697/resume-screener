{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details Form</title>
    <link rel="stylesheet" href="{% static 'css/candidate/candidate_details.css' %}">
</head>
<body>
    <div class="container">
        <h2>Job Details Form</h2>

        <form id="jobForm" method="POST" enctype="multipart/form-data" action="{% url 'candidate_details' request.user.profile.id %}">

            {% csrf_token %}

            <label>Full Name</label>
            <input type="text" id="fullname" name="fullname" required>

            <label>Phone</label>
            <input type="text" id="phone" name="phone">

            <!-- Gender -->
            <label>Gender</label>
            <select id="gender" name="gender" required>
                <option value="">-- Select Gender --</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <!-- Work Type -->
            <label>Work Type</label>
            <select id="workType" name="work_type" required>
                <option value="">-- Select Work Type --</option>
                <option value="wfh">Work From Home</option>
                <option value="hybrid">Hybrid</option>
                <option value="onsite">On-site</option>
            </select>

            <label>Preferred Location</label>
            <input type="text" id="preferredLocation" name="preferred_location" placeholder="e.g. Bangalore" required>

            <label>Skills</label>
            <textarea id="skills" name="skills" placeholder="Enter your skills..."></textarea>

            <label>Experience (in years)</label>
            <input type="number" id="experience" name="experience" min="0">

            <label>Upload Resume</label>
            <input type="file" id="resume" name="resume" accept=".pdf">

            <button type="submit" class="btn">Submit</button>
        </form>
    </div>

</body>
</html>
