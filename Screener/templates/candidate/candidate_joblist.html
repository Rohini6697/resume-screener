{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs – SmartHire</title>

  <link rel="stylesheet" href="{% static 'css/candidate/candidate_joblist.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

  <!-- Header -->
  <header class="dashboard-header">
    <div class="logo">SmartHire</div>
    <nav>
      <a href="{% url 'candidate' %}">Home</a>
      <a href="{% url 'candidate_profile' %}">Profile</a>
      <a class="active" href="{% url 'candidate_joblist' %}">Jobs</a>
      <a href="{% url 'candidate_applications' %}">Applications</a>
      <a href="{% url 'candidate_shortlist' %}">Shortlisted</a>
      <a href="{% url 'candidate_notification' %}">Notifications</a>
      <a href="{% url 'candidate_settings' %}">Settings</a>
      <a href="{% url 'home' %}" class="btn-logout">Logout</a>
    </nav>
  </header>


  <!-- Jobs Section -->
  <main class="dashboard-content">
    <div class="jobs-container">
      <h2>Available Jobs</h2>

      <div class="job-list">
        {% for j in jobs %}
        <div class="job-card">

          <h3>{{ j.title }}</h3>
          <div class="company">{{ j.company.name }} · {{ j.location }}</div>

          <div class="desc">
            {{ j.description|truncatewords:20 }}
          </div>

          <div class="job-actions">
            <a href="{% url 'view_job' %}" class="btn-apply">Apply</a>
          </div>

        </div>
        {% empty %}
        <p>No jobs found.</p>
        {% endfor %}
      </div>
    </div>
  </main>

</body>
</html>
