{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - SmartHire</title>
  <link rel="stylesheet" href="{% static 'css/candidate/candidate_profile.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

  <!-- Navbar -->
  <header class="dashboard-header">
    <div class="logo">SmartHire</div>
    <nav>
      <a href="{% url 'candidate' %}">Home</a>
      <a href="{% url 'candidate_profile' %}">Profile</a>
      <a href="{% url 'candidate_joblist' %}">Jobs</a>
      <a href="{% url 'candidate_applications' %}">Applications</a>
      <a href="{% url 'candidate_shortlist' %}">Shortlisted</a>
      <a href="{% url 'candidate_notification' %}">Notifications</a>
      <a href="{% url 'candidate_settings' %}">Settings</a>
      <a href="{% url 'home' %}" class="btn-logout">Logout</a>
    </nav>
  </header>

  <!-- Profile Content -->
  <main class="dashboard-content">
    <div class="profile-container">
      <h2>My Profile</h2>

      <div class="profile-card">
        <form method="POST" action="/update_profile" enctype="multipart/form-data">

          <div class="profile-photo-section">
            <img src="default-avatar.png" alt="Profile Photo" class="profile-photo"/>
            <label class="upload-btn">
              <input type="file" name="photo" hidden>
              <i class="fa-solid fa-camera"></i> Change Photo
            </label>
          </div>

          <div class="profile-fields">
            <label>Full Name</label>
            <input type="text" name="full_name" value="" required>

            <label>Email</label>
            <input type="email" name="email" value="" required>

            <label>Phone</label>
            <input type="text" name="phone" value="">

            <label>Upload Resume (PDF)</label>
            <input type="file" name="resume">

            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>

        </form>
      </div>
    </div>
  </main>

</body>
</html>
