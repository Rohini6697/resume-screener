{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Company Profile - SmartHire</title>
    <!-- <link rel="stylesheet" href="{% static 'css/dashboard.css' %}"> -->
    <link rel="stylesheet" href="{% static 'css/company/company_profile.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="brand">SmartHire</div>
            <div class="side-nav">
                <a href="{% url 'company' %}"><i class="fas fa-home"></i> Dashboard</a>
                <a href="{% url 'company_profile' %}" class="active"><i class="fas fa-building"></i> Company Profile</a>
                <a href="{% url 'post_job' %}"><i class="fas fa-briefcase"></i> Post a Job</a>
                <a href="#"><i class="fas fa-users"></i> Applicants</a>
                <a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main">
            <!-- Topbar -->
            <div class="topbar">
                <h1>Edit Company Profile</h1>
                <div class="profile">
                    <i class="fas fa-user-circle"></i>
                    <span>{{request.user.profile.company.name}}</span>
                </div>
            </div>

            <!-- Content -->
            <div class="content">
                <div class="profile-form-container">
                    <form action="" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="form-group">
                            <label>Company Logo</label>
                            <input type="file" name="logo">
                        </div>

                        <div class="form-group">
                            <label>Company Name</label>
                            <input type="text" value = {{request.user.profile.company.name}} name="name" placeholder="Enter company name" required>
                        </div>

                        <div class="form-group">
                            <label>Website</label>
                            <input type="url" value = {{request.user.profile.company.website}} name="website" placeholder="https://company.com">
                        </div>

                        <div class="form-group">
                            <label>Industry</label>
                            <input type="text" value = {{request.user.profile.company.industry}} name="industry" placeholder="e.g., Software Development">
                        </div>

                        <div class="form-group">
                            <label>Company Size</label>
                            <select value = {{request.user.profile.company.size}} name="size">
                                <option value="">Select</option>
                                <option>1-10 employees</option>
                                <option>10-50 employees</option>
                                <option>50-200 employees</option>
                                <option>200-500 employees</option>
                                <option>500+ employees</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Headquarters</label>
                            <input value = {{request.user.profile.company.location}} type="text" name="location" placeholder="City, Country">
                        </div>

                        <div class="form-group">
                            <label>About Company</label>
                            <textarea  name="about" rows="4" placeholder="Describe your company...">{{request.user.profile.company.about}}</textarea>
                        </div>

                        <div class="form-group">
                            <label>LinkedIn</label>
                            <input value = {{request.user.profile.company.linkedin}} type="url" name="linkedin" placeholder="https://linkedin.com/company">
                        </div>

                        <div class="form-group">
                            <label>Twitter</label>
                            <input value = {{request.user.profile.company.twitter}} type="url" name="twitter" placeholder="https://twitter.com/company">
                        </div>

                        <button type="submit" class="btn-save">Save Profile</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
